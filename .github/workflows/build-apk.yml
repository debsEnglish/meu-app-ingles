name: Build Android APK (ApexLex C1)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependências e gerar projeto Android
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Configurar permissão de microfone no AndroidManifest.xml
        run: |
          python3 -c '
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r") as f:
              content = f.read()
          perms = """    <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.INTERNET" />"""
          if "RECORD_AUDIO" not in content:
              content = content.replace("<application", perms + "\n    <application", 1)
          with open(path, "w") as f:
              f.write(content)
          '

      - name: Compilar APK de Debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publicar APK como Artefato para Download
        uses: actions/upload-artifact@v4
        with:
          name: ApexLex-C1-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
